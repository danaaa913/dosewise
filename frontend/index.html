<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b3a5f" />
    <meta
      name="description"
      content="منصة DoseWise تربط الصيدليات الأردنية لتبادل الأدوية المتوفرة وتقليل الهدر — طلبات موثقة، متابعة واضحة لحالات الطلبات، وتحقق من الصيدليات قبل التبادل."
    />
    <title>DoseWise | منصة تبادل الأدوية بين الصيدليات</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("dosewise.lang");
          var l = s === "ar" || s === "en" ? s : ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
          var d = document.documentElement;
          d.lang = l;
          d.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
