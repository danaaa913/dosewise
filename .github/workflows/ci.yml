name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dosewise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/dosewise
      SESSION_SECRET: ci-only-secret-not-used-in-production
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password-123456
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter backend exec tsc --noEmit

      - name: Push database schema
        run: pnpm db:push

      - name: Run tests
        run: pnpm --filter backend test

      - name: Build
        run: pnpm build
